name: Auto-Deploy on PR Merge

on:
  pull_request:
    types: [closed]
    branches:
      - cursor/pmweb-agent-6eca

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: cursor/pmweb-agent-6eca

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to VM
        run: |
          gcloud compute ssh pmweb-agent-vm \
            --zone=us-central1-a \
            --project=pmweb-automation \
            --command="cd ~/pmweb-automation && git fetch origin cursor/pmweb-agent-6eca && git reset --hard origin/cursor/pmweb-agent-6eca && sudo docker rm -f \$(sudo docker ps -aq) 2>/dev/null; sudo docker build -t pmweb-agent . && sudo docker run -d --name pmweb-agent -p 8080:8080 -p 6081:6081 -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} -e GITHUB_TOKEN=${{ secrets.GH_TOKEN }} -e PMWEB_BASE_URL=https://cmcs.pmweb.com/2025_1_00/pmweb/ -e PMWEB_USERNAME=admin -e PMWEB_PASSWORD=pmweb2 -e PMWEB_HEADLESS=false -e DISPLAY=:99 pmweb-agent"

      - name: Verify deployment
        run: |
          sleep 30
          curl -f http://35.224.6.237:8080/health || echo "Health check failed - container may still be starting"
