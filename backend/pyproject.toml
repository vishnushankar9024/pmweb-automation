[project]
name = "pmweb-automation"
version = "0.1.0"
description = "AI agent for automating PMWeb security, workflows, and forms"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
