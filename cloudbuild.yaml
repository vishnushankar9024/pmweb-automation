steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/pmweb-agent:$SHORT_SHA', '-t', 'gcr.io/$PROJECT_ID/pmweb-agent:latest', '.']

  # Step 2: Push to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pmweb-agent:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pmweb-agent:latest']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pmweb-agent'
      - '--image=gcr.io/$PROJECT_ID/pmweb-agent:$SHORT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--timeout=3600'
      - '--set-env-vars=OPENAI_API_KEY=$_OPENAI_API_KEY,PMWEB_BASE_URL=https://cmcs.pmweb.com/2025_1_00/pmweb/,PMWEB_USERNAME=admin,PMWEB_PASSWORD=pmweb2,PMWEB_HEADLESS=true'

images:
  - 'gcr.io/$PROJECT_ID/pmweb-agent:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/pmweb-agent:latest'

timeout: 1800s

substitutions:
  _REGION: 'us-central1'
  _OPENAI_API_KEY: ''
